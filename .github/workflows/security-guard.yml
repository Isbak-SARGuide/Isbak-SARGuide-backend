name: Security Guard

# HEM develop HEM main icin - dogrulamayi main'e ertelemiyoruz. Bir secret ya
# da acikli paket develop'a girdigi an risktir; main'e mergelenene kadar
# (haftalarca) yakalanmadan kalmasi yanlis olur. Ucu kontrol de hizli/stabil,
# develop'ta "hafif kalsin" gerekcesi (agir/karasiz test'ler icin gecerli
# olan bir gerekce) burada uygulanmaz.
#
# Build+test zaten ci.yml'de var ve ayni branch'leri kapsiyor - burada TEKRAR
# calistirmiyoruz, CI dakikasi israf olur. Bu workflow SADECE ci.yml'in
# kapsamadigi guvenlik/stil kontrollerini ekler. push tetikleyicisi ci.yml
# ile ayni gerekceyle var: PR'i bypass eden dogrudan push da dogrulansin.
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: security-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vulnerable-packages:
    name: Bilinen Acikli Paketler
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore
      - name: Acikli NuGet paketi var mi kontrol et
        run: |
          OUTPUT=$(dotnet list Isbak_SAR_Guide.Backend.slnx package --vulnerable --include-transitive 2>&1)
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -qi "has the following vulnerable packages"; then
            echo "::error::Acikli NuGet paketi bulundu - yukaridaki cikitiya bak."
            exit 1
          fi

  secret-scan:
    name: Secret Taramasi (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tum gecmisi tara - silinmis ama gecmiste kalan secret da yakalansin
      - name: Gitleaks calistir
        run: |
          curl -sSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . --no-banner --exit-code 1

  format-check:
    name: Format ve Stil
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet restore
      - name: dotnet format dogrula
        run: dotnet format --verify-no-changes --no-restore
